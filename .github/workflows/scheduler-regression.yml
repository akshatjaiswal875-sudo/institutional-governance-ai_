name: Scheduler regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/scheduler-ci-and-conflicts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-for-build-only
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-build-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Production build
        run: npm run build
